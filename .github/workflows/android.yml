name: android

on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      server:
        description: 服务器地址
        default: https://deepseek.0520112.xyz

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      DSX_SERVER: ${{ github.event.inputs.server || 'https://deepseek.0520112.xyz' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK (preinstalled on runner)
        run: echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV

      - name: Build web (app mode)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile || pnpm install
          DSX_APP=1 pnpm build

      - name: Capacitor project
        working-directory: android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#4D6BFE' --iconBackgroundColorDark '#4D6BFE' \
            --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#161616'
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />#' $M
          V=$(date +%y%m%d%H)
          sed -i "s/versionCode 1$/versionCode $V/; s/versionName \"1.0\"/versionName \"0.1.$GITHUB_RUN_NUMBER-beta\"/" android/app/build.gradle
          npx cap sync android

      - name: Gradle
        working-directory: android/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign
        working-directory: android
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*-unsigned.apk)
          $BT/zipalign -p -f 4 "$IN" aligned.apk
          $BT/apksigner sign --ks release.p12 --ks-type PKCS12 --ks-pass pass:dsbeta-release \
            --ks-key-alias dsbeta --out DeepSeek-Beta.apk aligned.apk
          $BT/apksigner verify DeepSeek-Beta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Beta-apk
          path: android/DeepSeek-Beta.apk
          retention-days: 30
